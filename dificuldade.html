<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velha Arena | Dificuldade</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="selection-wrap">
    <a class="back-link" href="index.html">← Voltar ao início</a>
    <div class="brand small-brand"><span class="brand-icon">✕○</span><span>VELHA<span class="brand-accent"> ARENA</span></span></div>
    <p class="eyebrow">PREPARE-SE PARA A PARTIDA</p>
    <h1>Escolha seu <span>desafio</span></h1>
    <p class="intro centered">Cada nível tem uma estratégia diferente. Qual será o seu?</p>
    <section class="difficulty-grid">
      <button class="difficulty-card" data-level="facil">
        <span class="level-icon">🌱</span><span class="level-name">Fácil</span>
        <span class="level-desc">A IA faz jogadas aleatórias. Ideal para aquecer.</span>
        <span class="level-tag">PARA COMEÇAR</span>
      </button>
      <button class="difficulty-card featured" data-level="medio">
        <span class="level-icon">⚡</span><span class="level-name">Médio</span>
        <span class="level-desc">A IA tenta bloquear suas jogadas e encontrar oportunidades.</span>
        <span class="level-tag">EQUILIBRADO</span>
      </button>
      <button class="difficulty-card" data-level="dificil">
        <span class="level-icon">🔥</span><span class="level-name">Difícil</span>
        <span class="level-desc">A IA usa uma estratégia avançada e é muito difícil de vencer.</span>
        <span class="level-tag">DESAFIO MÁXIMO</span>
      </button>
    </section>
    <p class="selection-hint">Você será o <b class="x-text">X</b> e começará jogando.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
