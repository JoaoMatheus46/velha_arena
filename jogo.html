<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velha Arena | Partida</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-wrap">
    <header class="game-header">
      <a class="back-link" href="dificuldade.html">← Trocar dificuldade</a>
      <div class="brand small-brand"><span class="brand-icon">✕○</span><span>VELHA<span class="brand-accent"> ARENA</span></span></div>
      <span class="level-indicator" id="levelIndicator">NÍVEL MÉDIO</span>
    </header>

    <section class="scoreboard">
      <article class="score-card player-score"><span class="score-symbol">✕</span><span class="score-label">VOCÊ</span><strong id="playerScore">0</strong></article>
      <article class="score-card draw-score"><span class="score-symbol">＝</span><span class="score-label">EMPATES</span><strong id="drawScore">0</strong></article>
      <article class="score-card ai-score"><span class="score-symbol">○</span><span class="score-label">IA</span><strong id="aiScore">0</strong></article>
    </section>

    <section class="arena">
      <div class="turn-row">
        <div><p class="eyebrow">PARTIDA ATUAL</p><h1>Mostre sua <span>estratégia.</span></h1></div>
        <div class="moves-box"><strong id="moveCount">0</strong><span>JOGADAS</span></div>
      </div>
      <div class="status-pill" id="status" aria-live="polite"><span class="status-dot"></span> Sua vez! Escolha uma casa.</div>
      <div class="board" id="board" role="grid" aria-label="Tabuleiro do jogo da velha">
        <button class="cell" data-index="0" aria-label="Casa 1"></button>
        <button class="cell" data-index="1" aria-label="Casa 2"></button>
        <button class="cell" data-index="2" aria-label="Casa 3"></button>
        <button class="cell" data-index="3" aria-label="Casa 4"></button>
        <button class="cell" data-index="4" aria-label="Casa 5"></button>
        <button class="cell" data-index="5" aria-label="Casa 6"></button>
        <button class="cell" data-index="6" aria-label="Casa 7"></button>
        <button class="cell" data-index="7" aria-label="Casa 8"></button>
        <button class="cell" data-index="8" aria-label="Casa 9"></button>
      </div>
      <div class="game-actions">
        <button class="primary-button compact" id="newGame">↻ NOVA PARTIDA</button>
        <button class="secondary-button" id="resetScore">ZERAR PLACAR</button>
      </div>
    </section>
    <footer class="game-footer">VOCÊ JOGA COMO <b class="x-text">X</b> <span>•</span> A INTELIGÊNCIA ARTIFICIAL JOGA COMO <b class="o-text">O</b></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
